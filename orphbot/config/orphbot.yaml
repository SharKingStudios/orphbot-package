motor_driver:
  ros__parameters:
    max_pwm: 0.35
    deadband: 0.04
    cmd_timeout: 0.5
    max_linear_speed: 0.4
    max_angular_speed: 1.5
    enable_pin: -1
    left_front_pins: [5, 6]
    left_rear_pins: [13, 19]
    right_front_pins: [20, 21]
    right_rear_pins: [23, 24]
    invert_left: false
    invert_right: false

odom_publisher:
  ros__parameters:
    odom_frame: odom
    base_frame: base_link
    publish_rate: 10.0
    linear_scale: 1.0
    angular_scale: 1.0
    path_max_poses: 500
    cmd_timeout: 0.55
    path_min_distance: 0.01
    path_min_yaw: 0.05

mpu6050_node:
  ros__parameters:
    bus: 1
    address: 104
    frame_id: imu_link
    publish_rate: 20.0
